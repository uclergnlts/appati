name: Mac uygulaması

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      yayinla:
        description: "İmzalı ve onaylı paketi GitHub Release olarak yayınla (otomatik güncelleme bunu indirir)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # yalnızca "yayinla" seçilince Release oluşturmak için kullanılır
    env:
      # Developer ID sertifikası depoya sır olarak eklendiyse uygulama imzalanır ve Apple'a onaylatılır;
      # eklenmediyse eskisi gibi imzasız (ad-hoc) paketlenir. Kurulum: docs/IMZALAMA.md
      IMZALI: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Paketle (imzasız)
        if: env.IMZALI != 'true'
        run: npm run dist

      - name: İmzala (Developer ID)
        if: env.IMZALI == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        # Yalnızca .app üretilir ve imzalanır; Apple onayı aşağıda ayrı ve süre sınırlı yapılır.
        run: |
          npx electron-builder --mac --dir --universal --publish never -c.mac.notarize=false
          UYG=$(find dist -maxdepth 2 -name "Appati.app" | head -1)
          echo "UYG=$UYG" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$UYG"

      - name: Apple onayı (notarization)
        if: env.IMZALI == 'true'
        env:
          ASC_ANAHTAR: ${{ secrets.ASC_ANAHTAR }}
          ASC_ANAHTAR_ID: ${{ secrets.ASC_ANAHTAR_ID }}
          ASC_YAYINCI_ID: ${{ secrets.ASC_YAYINCI_ID }}
        # Apple'ın kuyruğu bazen (özellikle bir hesabın ilk gönderiminde) çok uzun sürer. 25 dakikada bitmezse
        # derleme beklemeyi bırakır: uygulama yine imzalıdır ve Apple onayı tamamlayınca macOS bunu çevrimiçi doğrular.
        run: |
          printf '%s' "$ASC_ANAHTAR" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent "$UYG" "$RUNNER_TEMP/onay.zip"
          xcrun notarytool submit "$RUNNER_TEMP/onay.zip" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_ANAHTAR_ID" --issuer "$ASC_YAYINCI_ID" \
            --wait --timeout 25m --output-format json > "$RUNNER_TEMP/onay.json" || true
          rm -f "$RUNNER_TEMP/asc.p8"
          cat "$RUNNER_TEMP/onay.json" || true
          DURUM=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$RUNNER_TEMP/onay.json" 2>/dev/null || echo "")
          KIMLIK=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id',''))" "$RUNNER_TEMP/onay.json" 2>/dev/null || echo "")
          echo "ONAY=$DURUM" >> "$GITHUB_ENV"
          if [ "$DURUM" = "Accepted" ]; then
            xcrun stapler staple "$UYG"
            spctl --assess --type execute --verbose=2 "$UYG"
            echo "### İmzalı ve Apple onaylı" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DURUM" = "Invalid" ] || [ "$DURUM" = "Rejected" ]; then
            echo "::error::Apple onayı reddetti (gönderim $KIMLIK)."
            exit 1
          else
            echo "### İmzalı; Apple onayı henüz bitmedi" >> "$GITHUB_STEP_SUMMARY"
            echo "Gönderim kimliği: \`$KIMLIK\` (durum: ${DURUM:-bilinmiyor}). Uygulama imzalıdır; Apple onayı tamamlayınca macOS ilk açılışta çevrimiçi doğrular." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Apple onayı 25 dakikada bitmedi; imzalı ama henüz onaysız paket yüklendi."
          fi

      - name: Paketle (.dmg ve .zip)
        if: env.IMZALI == 'true'
        run: |
          SURUM=$(node -p "require('./package.json').version")
          ditto -c -k --keepParent "$UYG" "dist/Appati-$SURUM-universal.zip"
          mkdir -p "$RUNNER_TEMP/dmg" && cp -R "$UYG" "$RUNNER_TEMP/dmg/" && ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Appati" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/Appati-$SURUM-universal.dmg"

      # Yayın: yalnızca elle başlatılıp "yayinla" işaretlendiğinde ve Apple onayı geldiğinde.
      # Kurulu Appati'ler releases.json dosyasına bakıp yeni sürümü kendiliğinden indirir.
      - name: Yayınla (GitHub Release)
        if: env.IMZALI == 'true' && inputs.yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ONAY" != "Accepted" ]; then echo "::error::Apple onayı gelmeden yayınlanmaz (durum: ${ONAY:-bilinmiyor})."; exit 1; fi
          SURUM=$(node -p "require('./package.json').version")
          if gh release view "v$SURUM" >/dev/null 2>&1; then echo "::error::v$SURUM zaten yayınlanmış; package.json'daki sürümü artır."; exit 1; fi
          node tools/surum-json.js "$SURUM" "$GITHUB_REPOSITORY" > dist/releases.json
          gh release create "v$SURUM" "dist/Appati-$SURUM-universal.zip" "dist/Appati-$SURUM-universal.dmg" dist/releases.json \
            --target "$GITHUB_SHA" --title "Appati $SURUM" --notes-file docs/SURUM-NOTU.md
          echo "### v$SURUM yayınlandı" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Appati-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
